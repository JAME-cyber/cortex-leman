<!doctype html><html><head><meta charset='utf-8'>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:2560px;height:1440px;overflow:hidden}

body{
  background:#1A1A1A;
  font-family:'Inter',sans-serif;
  position:relative;
}

/* Texture / warmth overlay */
.texture{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 60% 80% at 20% 50%, rgba(181,82,46,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 50% 70% at 85% 50%, rgba(232,163,61,0.12) 0%, transparent 55%),
    linear-gradient(135deg, #1A1A1A 0%, #221810 50%, #1A1A1A 100%);
}

/* Adinkra pattern overlay (subtle) */
.pattern{
  position:absolute;inset:0;
  opacity:0.03;
  background-image:
    radial-gradient(circle at 15% 25%, #E8A33D 2px, transparent 3px),
    radial-gradient(circle at 45% 75%, #E8A33D 2px, transparent 3px),
    radial-gradient(circle at 75% 35%, #E8A33D 2px, transparent 3px);
  background-size:180px 180px;
}

/* === SAFE ZONE (1546 x 423 centered) === */
/* Vertical: (1440-423)/2 = 508px from top */
/* Horizontal: (2560-1546)/2 = 507px from left */
.safe-zone{
  position:absolute;
  top:508px;left:507px;
  width:1546px;height:423px;
  display:flex;align-items:center;gap:50px;
}

/* Logo section */
.logo-wrap{
  flex-shrink:0;
  width:280px;height:280px;
  position:relative;
}
.logo-wrap img{
  width:100%;height:100%;
  object-fit:contain;
  filter:drop-shadow(0 4px 20px rgba(232,163,61,0.3));
}

/* Text section */
.text-section{
  flex-grow:1;
  display:flex;flex-direction:column;justify-content:center;gap:8px;
}

.channel-name{
  font-family:'Playfair Display',serif;
  font-size:96px;font-weight:900;
  color:#E8A33D;
  letter-spacing:2px;
  line-height:1;
  text-shadow:0 3px 30px rgba(232,163,61,0.15);
}

.tagline{
  font-family:'Playfair Display',serif;
  font-style:italic;
  font-size:34px;
  color:#F4E8D0;
  opacity:0.85;
  letter-spacing:0.5px;
  margin-top:4px;
}

.divider{
  width:120px;height:3px;
  background:linear-gradient(90deg,#E8A33D,transparent);
  margin:12px 0;
}

.topics{
  display:flex;gap:24px;margin-top:14px;
}
.topic{
  font-family:'Inter',sans-serif;
  font-size:20px;font-weight:600;
  color:#B5522E;
  letter-spacing:3px;
  text-transform:uppercase;
}
.topic::before{content:'◆ ';color:#E8A33D;font-size:14px}

/* === RIGHT SIDE DECORATIVE (outside safe zone, visible on desktop) === */
.side-accent{
  position:absolute;
  right:0;top:0;
  width:400px;height:100%;
  background:linear-gradient(270deg, rgba(232,163,61,0.06) 0%, transparent 100%);
}

/* Corner ornaments (visible on TV/desktop, outside safe zone) */
.corner-tl{
  position:absolute;top:60px;left:60px;
  width:120px;height:120px;
  border-top:3px solid rgba(232,163,61,0.3);
  border-left:3px solid rgba(232,163,61,0.3);
}
.corner-br{
  position:absolute;bottom:60px;right:60px;
  width:120px;height:120px;
  border-bottom:3px solid rgba(232,163,61,0.3);
  border-right:3px solid rgba(232,163,61,0.3);
}

/* Bottom tag (outside safe zone on desktop) */
.bottom-prompt{
  position:absolute;
  bottom:80px;left:50%;transform:translateX(-50%);
  font-family:'Inter',sans-serif;
  font-size:18px;
  color:rgba(244,232,208,0.4);
  letter-spacing:6px;
  text-transform:uppercase;
}
</style>
</head>
<body>

<div class="texture"></div>
<div class="pattern"></div>
<div class="side-accent"></div>
<div class="corner-tl"></div>
<div class="corner-br"></div>

<div class="safe-zone">
  <div class="logo-wrap">
    <img src="../logo_sankofa_seedream.png" alt="Sankofa">
  </div>
  <div class="text-section">
    <div class="channel-name">SANKOFA</div>
    <div class="divider"></div>
    <div class="tagline">L'histoire qu'on n'a pas racontée.</div>
    <div class="topics">
      <span class="topic">Reines</span>
      <span class="topic">Royaumes</span>
      <span class="topic">Légendes</span>
    </div>
  </div>
</div>

<div class="bottom-prompt">Retourne la chercher</div>

</body>
</html>
