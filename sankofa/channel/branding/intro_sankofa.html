            filter:drop-shadow(0 0 20px rgba(232,163,61,0.4));z-index:10;pointer-events:none"/>


<script>
const DURATION = 5.0;

const logo = document.getElementById('logo');
const bird = document.getElementById('birdImg');
const outerRing = document.getElementById('outerRing');
const innerRing = document.getElementById('innerRing');
const eggPulse = document.getElementById('eggPulse');
const channelName = document.getElementById('channelName');
const divider = document.getElementById('divider');
const tagline = document.getElementById('tagline');
const subtitle = document.getElementById('subtitle');
const shineRect = document.getElementById('shineRect');
const particles = document.getElementById('particles');

// Pre-compute ring circumference for draw animation
const ringCircumference = 2 * Math.PI * 240;
outerRing.style.strokeDasharray = ringCircumference;
outerRing.style.strokeDashoffset = ringCircumference;
innerRing.style.strokeDasharray = 2 * Math.PI * 225;
innerRing.style.strokeDasharray = ringCircumference * 0.94;
innerRing.style.strokeDashoffset = 2 * Math.PI * 225;

function easeOutCubic(x){ return 1 - Math.pow(1-x, 3); }
function easeInOutQuad(x){ return x < 0.5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2; }

// Pre-collect particle circles
const particleList = particles.querySelectorAll('circle');

window.render = function(t) {
  // 1. Particles drift in (0 → 1.5s)
  const pT = Math.min(t / 1.5, 1);
  particleList.forEach(function(p, i) {
    const delay = i * 0.1;
    const localT = Math.min(Math.max((t - delay) / 0.8, 0), 1);
    const baseOpacity = parseFloat(p.getAttribute('opacity') || '0');
    p.setAttribute('opacity', localT * (0.3 + Math.random() * 0.3));
  });

  // 2. Outer ring draws itself (0.3 → 1.8s)
  const ringT = Math.min(Math.max((t - 0.3) / 1.5, 0), 1);
  const ringE = easeOutCubic(ringT);
  outerRing.style.strokeDashoffset = ringCircumference * (1 - ringE);
  innerRing.style.strokeDashoffset = 2 * Math.PI * 225 * (1 - ringE);

  // 3. Logo fades in + scales (0.8 → 2.0s)
  const logoT = Math.min(Math.max((t - 0.8) / 1.2, 0), 1);
  const logoE = easeOutCubic(logoT);
  // Bird image fades in (setAttribute for SVG elements)
  bird.style.opacity = logoE;
  // Subtle scale from 0.85 to 1.0
  const scale = 0.85 + 0.15 * logoE;
  logo.setAttribute('transform', 'translate(540, 700) scale(' + scale.toFixed(3) + ')');

  // 4. Egg pulse (at t=2.0s) — the egg glows, representing wisdom reclaimed
  const eggT = Math.min(Math.max((t - 2.0) / 0.6, 0), 1);
  if (eggT > 0 && eggT < 1) {
    eggPulse.setAttribute('r', eggT * 40);
    eggPulse.style.opacity = (1 - eggT) * 0.8;
  } else {
    eggPulse.style.opacity = 0;
  }

  // 5. Channel name fades in (2.4 → 3.2s)
  const nameT = Math.min(Math.max((t - 2.4) / 0.8, 0), 1);
  const nameE = easeOutCubic(nameT);
  channelName.style.opacity = nameE;

  // 6. Shine sweep on text (3.0 → 3.8s)
  const sweepT = Math.min(Math.max((t - 3.0) / 0.8, 0), 1);
  if (sweepT > 0 && sweepT < 1) {
    const shineX = -500 + sweepT * 2080;
    shineRect.setAttribute('x', shineX);
  } else if (sweepT >= 1) {
    shineRect.setAttribute('x', 1580);
  }

  // 7. Divider extends (3.4 → 4.0s)
  const divT = Math.min(Math.max((t - 3.4) / 0.6, 0), 1);
  const divE = easeOutCubic(divT);
  const halfLen = 120 * divE;
  divider.setAttribute('x1', 540 - halfLen);
  divider.setAttribute('x2', 540 + halfLen);
  divider.style.opacity = divE * 0.7;

  // 8. Tagline fades in (3.8 → 4.5s)
  const tagT = Math.min(Math.max((t - 3.8) / 0.7, 0), 1);
  tagline.style.opacity = tagT * 0.95;

  // 9. Subtitle fades in last (4.2 → 4.8s)
  const subT = Math.min(Math.max((t - 4.2) / 0.6, 0), 1);
  subtitle.style.opacity = subT * 0.8;
};

window.DURATION = DURATION;
window.render(0);
</script>
