<script>
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

const logo = document.getElementById('logoImg');
const ring = document.getElementById('ring');
const divider = document.getElementById('divider');
const title = document.getElementById('title');
const tagline = document.getElementById('tagline');
const sub = document.getElementById('sub');

function render(t) {
  const DURATION = 2.5;

  // 1. Ring draws itself (0 → 0.6s) via stroke-dasharray
  const ringT = Math.min(t / 0.6, 1);
  const ringE = easeOutCubic(ringT);
  const circ = 2 * Math.PI * 180;
  ring.setAttribute('stroke-dasharray', circ);
  ring.setAttribute('stroke-dashoffset', circ * (1 - ringE));

  // 2. Logo fades in (0.2 → 0.9s)
  const logoT = Math.min(Math.max((t - 0.2) / 0.7, 0), 1);
  const logoE = easeOutCubic(logoT);
  logo.style.opacity = logoE;

  // 3. Title appears (0.6 → 1.1s)
  const titleT = Math.min(Math.max((t - 0.6) / 0.5, 0), 1);
  const titleE = easeOutCubic(titleT);
  title.style.opacity = titleE;
  title.style.transform = `translateY(${(1 - titleE) * 15}px)`;

  // 4. Divider extends (0.8 → 1.2s)
  const divT = Math.min(Math.max((t - 0.8) / 0.4, 0), 1);
  const divE = easeOutCubic(divT);
  divider.style.width = `${divE * 200}px`;
  divider.style.left = `${540 - divE * 100}px`;

  // 5. Tagline (1.0 → 1.5s)
  const tagT = Math.min(Math.max((t - 1.0) / 0.5, 0), 1);
  tagline.style.opacity = easeOutCubic(tagT);

  // 6. Sub (1.2 → 1.6s)
  const subT = Math.min(Math.max((t - 1.2) / 0.4, 0), 1);
  sub.style.opacity = easeOutCubic(subT);

  // 7. Hold until end (2.5s)
}

// Expose for Playwright capture
window.render = render;
</script>
</body></html>
