services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cortex-leman-backend
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - KIEAI_API_KEY=${KIEAI_API_KEY}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_LOG_LEVEL=INFO
      - CORS_ORIGINS=*
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
